[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-guard"
version = "0.4.0"
description = "Check physics-ML hybrid models before training (correction capacity) and before acceptance (coverage-matched acceptance test)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ahmed Ibrahim Asl"}, {name = "B. M. El-Den"}]
keywords = ["hybrid models", "physics-informed machine learning", "model evaluation", "acceptance testing",
            "selective prediction", "wind power"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.urls]
Homepage = "https://eng-asl.com/hybrid-guard/"
Documentation = "https://ahmed-ibrahim-asl.github.io/hybrid-guard/"
Source = "https://github.com/ahmed-ibrahim-asl/hybrid-guard"
Changelog = "https://github.com/ahmed-ibrahim-asl/hybrid-guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.6"]
parquet = ["pyarrow>=12"]

[project.scripts]
hybrid-guard = "hybrid_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
