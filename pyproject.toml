[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-guard"
version = "0.1.0"
description = "Check physics-ML hybrid models before training (correction capacity) and before acceptance (coverage-matched acceptance test)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ahmed Ibrahim Asl"}, {name = "B. M. El-Den"}]
keywords = ["hybrid models", "physics-informed machine learning", "model evaluation", "acceptance testing",
            "selective prediction", "wind power"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
